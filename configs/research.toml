# إعدادات الخط الموحّد — من MBO إلى التقرير
# يُحمَّل مباشرة عبر PipelineConfig.from_toml (أقسام [streaming]/[depth] مضمّنة هنا).
# Unified research pipeline: load → features → SSL‖M9 → alpha → report

[determinism]
global_seed = 20260719

[temporal]
interval_ns = 1_000_000_000    # 1 second buckets
horizon = 1
embargo_ns = 1_000_000_000

[cross_market]
latency_ns = 5_000_000         # 5 µs MNQ lag vs NQ (adjust per venue)
lead_lag_window = 20

[execution]
mode = "intraday"              # intraday | mid
slippage_ticks = 0.5
tick_size = 0.25
commission_bps = 0.0

[ssl]
mode = "tick"                    # tick | bucket
window = 5
n_components = 4
n_splits = 3

# بناء الميزات: streaming = آلة حالة حدث-بحدث (افتراضي) | batch = نوافذ مجمّعة
[features]
mode = "streaming"

# إشارات تُفرَز في قناة الألفا (نفس طبقة trap_setup / lead_lag / VP)
[signals]
include_failed_fvg = true
include_auction_vp = true
include_failed_breakout = true
columns = [
  "nq_delta",
  "mnq_delta",
  "trap_setup",
  "fail_fvg",
  "fail_breakout",
  "vp_of_delta",
  "vp_absorb",
  "vp_look_fail",
  "vp_order_accel",
  "vp_early_imbalance",
  "vp_fr_accepted_expansion",
  "vp_fr_exit",
  "vp_auction_setup",
  "vp_fsm_break",
  "vp_fsm_retest",
]

[streaming]
# يُقرأ فعليًا عبر PipelineConfig.from_toml (لا يعتمد على «وراثة» ضمنية)
research_interval_ns = 1_000_000_000
micro_interval_ns = 100_000_000
use_micro_interval = false
sample_mode = "last_state"

[depth]
filter_noise = true
include_bottom_book = true

[statistics]
alpha = 0.05
n_permutations = 2000

# بحث رمزي بلا if (اختياري — يتطلب: pip install 'nq[gp]')
# scripts/run_symbolic_search.py --backend both|deap|gplearn
[hypothesis_search]
backend = "grid"                 # grid | deap | gplearn | both
population_size = 60
generations = 8
max_depth = 3
n_programs = 2

[data]
# مسارات MBO (Parquet/Arrow/CSV/.zst) — أو مرّر --nq / --mnq من CLI
nq_path = "data/raw/nq.parquet"
mnq_path = "data/raw/mnq.parquet"
output_dir = "data/runs/latest"
# dual = NQ+MNQ | nq_only = ملف NQ واحد فقط (يُكرَّر داخليًا لـ cross-market)
cross_market_mode = "nq_only"
# حد صفوف للتجارب (0 = بدون حد) — أو --max-rows من CLI
max_rows = 0

# طباعة تقدّم الخطوات على stderr أثناء التشغيل
# parallel_coverage=false = مسار خطي مقروء (افتراضي)؛ true = SSL‖M9 مع بادئة [SSL]/[M9]
[run]
quiet = false
parallel_coverage = false
