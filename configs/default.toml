# الإعدادات الافتراضية للنظام — كل تجربة يجب أن ترث من هذا الملف وتوثّق أي تغيير.
# Default configuration. Every experiment must inherit from this and version any override.

[project]
instruments = ["NQ", "MNQ"]      # MBO-only universe
data_source = "MBO"              # المصدر الوحيد للحقيقة (single source of truth)

[determinism]
# البذرة العامة لضمان قابلية إعادة الإنتاج (reproducibility).
global_seed = 20260719

[temporal]
# منع التسريب الزمني: كل التقسيمات زمنية صارمة (walk-forward + embargo).
# embargo يُقاس بالنانوثانية بين نهاية التدريب وبداية الاختبار.
split_strategy = "walk_forward"
embargo_ns = 1_000_000_000       # 1 second embargo (adjust per horizon)
# أفق التقييم الافتراضي — يدخل في purge_samples عبر TemporalPolicy
horizon = 1

[performance]
# أسلوب متجهي/عمودي ومعالجة تدفّقية للبيانات الضخمة.
engine = "polars"
streaming = true
batch_events = 5_000_000         # حجم الدفعة عند المعالجة التدفّقية

[streaming]
# عيّنة البحث من آلة الحالة اللحظية: آخر حالة داخل كل فاصل.
# تحذير: interval_ns=1s يطمس دقة الميكرو-هيكل؛ للبحوث الدقيقة استخدم
# فاصل أصغر (مثلاً 100ms) عبر use_micro_interval=true أو research_interval_ns.
# ترتيب أولوية ساعة البحث في PipelineConfig.from_toml:
#   use_micro_interval → research_interval_ns → [temporal].interval_ns
research_interval_ns = 1_000_000_000   # 1s — خشن نسبيًا
micro_interval_ns = 100_000_000        # 100ms — دقة أدق للمسار الميكروي
use_micro_interval = false             # true → interval_ns = micro_interval_ns
# sample_mode=last_state يثبّت availability_ts=bucket_end (موثّق؛ ليس متوسطًا)
sample_mode = "last_state"

[depth]
# فلتر ضوضاء + أسفل الدفتر على الخط الموحّد (L1–L5 + bb_*)
filter_noise = true
include_bottom_book = true
