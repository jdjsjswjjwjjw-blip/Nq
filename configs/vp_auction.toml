# فرضيات Volume Profile + التوازن/الاختلال — NQ فقط
# Volume Profile / Auction balance–imbalance hypotheses (NQ-only)
# رينج VP = 5 دقائق · فعل (ارتداد/كسر/دخول) = 30 ثانية

[determinism]
global_seed = 20260719

[temporal]
# ساعة البحث/الفعل (ارتداد متوازن · كسر+دخول مختلّ)
interval_ns = 30_000_000_000
# رينج Volume Profile / حدود VA الثلاثة
profile_interval_ns = 300_000_000_000
horizon = 1
embargo_ns = 30_000_000_000

[cross_market]
latency_ns = 0
lead_lag_window = 2

[execution]
mode = "intraday"
slippage_ticks = 0.5
tick_size = 0.25
commission_bps = 0.0

[ssl]
mode = "bucket"
window = 5
n_components = 4
n_splits = 3

[features]
mode = "batch"

# فرز IC: متنبّئات اتجاهية موقّعة فقط (بلا vp_rel_*/excess/أعلام نظام)
[signals]
include_failed_fvg = false
include_auction_vp = true
include_failed_breakout = false
columns = [
  "vp_of_delta",
  "vp_absorb",
  "vp_look_fail",
  "vp_flip_to_imbalance",
  "vp_pullback_defense",
  "vp_fr_accepted_expansion",
  "vp_fr_exit",
  "vp_auction_setup",
  "vp_fsm_break",
  "vp_fsm_retest",
  "nq_delta",
]

[statistics]
alpha = 0.05
n_permutations = 2000

[data]
nq_path = "data/raw/nq.parquet"
mnq_path = "data/raw/nq.parquet"
output_dir = "data/runs/vp_auction"
cross_market_mode = "nq_only"
max_rows = 0
